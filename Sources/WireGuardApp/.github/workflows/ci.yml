name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1

    - name: Build and test
      run: |
        xcodebuild -scheme WireGuardApp -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 12,OS=latest' build test
